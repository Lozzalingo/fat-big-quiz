services:
  # Next.js Frontend
  frontend:
    image: fatbigquiz-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fatbigquiz_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://fatbigquiz.com
      - NEXT_PUBLIC_BASE_URL=https://fatbigquiz.com
      - NEXT_PUBLIC_DO_SPACES_CDN_ENDPOINT=https://aitshirts-laurence-dot-computer.sfo3.cdn.digitaloceanspaces.com
      - NEXT_PUBLIC_DO_SPACES_FOLDER=fat-big-quiz
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - NEXTAUTH_URL=https://fatbigquiz.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - DATABASE_URL=mysql://fatbigquiz:${DB_PASSWORD}@db:3306/fatbigquiz
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fatbigquiz_network

  # Express API Backend
  api:
    image: fatbigquiz-api:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fatbigquiz_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=mysql://fatbigquiz:${DB_PASSWORD}@db:3306/fatbigquiz
      - FRONTEND_URL=https://fatbigquiz.com
      - DO_SPACES_REGION=sfo3
      - DO_SPACES_BUCKET=aitshirts-laurence-dot-computer
      - DO_SPACES_KEY=${DO_SPACES_KEY}
      - DO_SPACES_SECRET=${DO_SPACES_SECRET}
      - DO_SPACES_FOLDER=fat-big-quiz
      - DO_SPACES_ENDPOINT=https://sfo3.digitaloceanspaces.com
      - DO_SPACES_CDN_ENDPOINT=https://aitshirts-laurence-dot-computer.sfo3.cdn.digitaloceanspaces.com
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYMENTS_SERVICE_URL=${PAYMENTS_SERVICE_URL}
      - PAYMENTS_API_KEY=${PAYMENTS_API_KEY}
      - STORAGE_SERVICE_URL=${STORAGE_SERVICE_URL}
      - STORAGE_API_KEY=${STORAGE_API_KEY}
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL}
      - EMAIL_SERVICE_API_KEY=${EMAIL_SERVICE_API_KEY}
      - SITE_MONITOR_URL=${SITE_MONITOR_URL}
      - ANALYTICS_SERVICE_URL=${ANALYTICS_SERVICE_URL}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - TICKER_API_KEY=${TICKER_API_KEY}
      - WEBHOOK_API_KEY=${WEBHOOK_API_KEY}
      - GOOGLE_MERCHANT_ID=5708205694
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/google-merchant-credentials.json
      - DOWNLOAD_SECRET=${DOWNLOAD_SECRET}
      - TEST_DOWNLOAD_SESSION=${TEST_DOWNLOAD_SESSION}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./server/config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fatbigquiz_network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: fatbigquiz_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=fatbigquiz
      - MYSQL_USER=fatbigquiz
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fatbigquiz_network

volumes:
  mysql_data:

networks:
  fatbigquiz_network:
    driver: bridge
