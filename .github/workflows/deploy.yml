name: Deploy Fat Big Quiz

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without Docker cache'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout shared packages
        uses: actions/checkout@v4
        with:
          repository: Lozzalingo/lozzalingo-js-packages
          path: packages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          # Run tsc and fail only on errors in FBQ source (not shared packages)
          npx tsc --noEmit 2>&1 | tee /tmp/tsc-output.txt
          FBQ_ERRORS=$(grep "error TS" /tmp/tsc-output.txt | grep -v "^\.\./packages/" | wc -l)
          if [ "$FBQ_ERRORS" -gt 0 ]; then
            echo "::error::Found $FBQ_ERRORS TypeScript errors in Fat Big Quiz source:"
            grep "error TS" /tmp/tsc-output.txt | grep -v "^\.\./packages/"
            exit 1
          fi
          echo "Type check passed (0 FBQ errors)"

      - name: Lint
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fatbigquiz-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          load: true
          tags: fatbigquiz-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}

      - name: Save images to tar
        run: |
          docker save fatbigquiz-frontend:latest | gzip > fatbigquiz-frontend.tar.gz
          docker save fatbigquiz-api:latest | gzip > fatbigquiz-api.tar.gz
          ls -lh fatbigquiz-*.tar.gz

      - name: Clean up server disk
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Before cleanup ==="
            df -h /
            rm -f /tmp/fatbigquiz-*.tar.gz
            docker image prune -f 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            echo "=== After cleanup ==="
            df -h /

      - name: Transfer images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "fatbigquiz-frontend.tar.gz,fatbigquiz-api.tar.gz"
          target: "/tmp/"

      - name: Sync docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/fat-big-quiz/"

      - name: Deploy with auto-rollback
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/fat-big-quiz

            # Save current working images for rollback
            echo "=== Tagging current images for rollback ==="
            docker tag fatbigquiz-frontend:latest fatbigquiz-frontend:rollback 2>/dev/null || true
            docker tag fatbigquiz-api:latest fatbigquiz-api:rollback 2>/dev/null || true

            # Load new images
            echo "=== Loading new images ==="
            docker load < /tmp/fatbigquiz-frontend.tar.gz
            docker load < /tmp/fatbigquiz-api.tar.gz
            rm -f /tmp/fatbigquiz-frontend.tar.gz /tmp/fatbigquiz-api.tar.gz

            # Restart services with new images (db stays up)
            echo "=== Starting new containers ==="
            docker compose up -d --no-build frontend api

            # Health check with retries
            echo "=== Health check (waiting 15s) ==="
            sleep 15
            RETRIES=3
            HEALTHY=false
            for i in $(seq 1 $RETRIES); do
              FRONTEND=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo "FAIL")
              API=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || echo "FAIL")
              echo "Attempt $i: Frontend=$FRONTEND API=$API"
              if [ "$FRONTEND" = "200" ] && [ "$API" = "200" ]; then
                HEALTHY=true
                break
              fi
              if [ "$i" -lt "$RETRIES" ]; then
                echo "Retrying in 10s..."
                sleep 10
              fi
            done

            if [ "$HEALTHY" = "true" ]; then
              echo "=== Deploy successful ==="
              docker rmi fatbigquiz-frontend:rollback 2>/dev/null || true
              docker rmi fatbigquiz-api:rollback 2>/dev/null || true
              docker image prune -f || true
            else
              echo "=== HEALTH CHECK FAILED - ROLLING BACK ==="
              docker compose logs --tail 30 frontend api

              docker tag fatbigquiz-frontend:rollback fatbigquiz-frontend:latest 2>/dev/null || true
              docker tag fatbigquiz-api:rollback fatbigquiz-api:latest 2>/dev/null || true
              docker compose up -d --no-build frontend api

              echo "=== Waiting 15s for rollback containers ==="
              sleep 15
              FRONTEND2=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo "FAIL")
              API2=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || echo "FAIL")
              echo "After rollback: Frontend=$FRONTEND2 API=$API2"

              echo "DEPLOY FAILED - ROLLED BACK TO PREVIOUS VERSION"
              exit 1
            fi
