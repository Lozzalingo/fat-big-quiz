name: Deploy Fat Big Quiz

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without Docker cache'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout shared packages
        uses: actions/checkout@v4
        with:
          repository: Lozzalingo/lozzalingo-js-packages
          path: packages

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fatbigquiz-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          load: true
          tags: fatbigquiz-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}

      - name: Save images to tar
        run: |
          docker save fatbigquiz-frontend:latest | gzip > fatbigquiz-frontend.tar.gz
          docker save fatbigquiz-api:latest | gzip > fatbigquiz-api.tar.gz
          ls -lh fatbigquiz-*.tar.gz

      - name: Clean up server disk
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Before cleanup ==="
            df -h /
            rm -f /tmp/fatbigquiz-*.tar.gz
            docker system prune -af 2>/dev/null || docker image prune -af 2>/dev/null || true
            echo "=== After cleanup ==="
            df -h /

      - name: Transfer images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "fatbigquiz-frontend.tar.gz,fatbigquiz-api.tar.gz"
          target: "/tmp/"

      - name: Sync docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/fat-big-quiz/"

      - name: Load images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/fat-big-quiz

            # Load new images
            docker load < /tmp/fatbigquiz-frontend.tar.gz
            docker load < /tmp/fatbigquiz-api.tar.gz

            # Clean up tar files
            rm -f /tmp/fatbigquiz-frontend.tar.gz /tmp/fatbigquiz-api.tar.gz

            # Restart services (db stays up)
            docker compose up -d --no-build frontend api

            # Clean up old images
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Waiting 15s for containers to start..."
            sleep 15
            FRONTEND=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo "FAIL")
            API=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:3001/api/health || echo "FAIL")
            echo "Frontend: $FRONTEND"
            echo "API: $API"
            if [ "$FRONTEND" != "200" ] || [ "$API" != "200" ]; then
              echo "DEPLOY FAILED"
              docker compose -f /root/fat-big-quiz/docker-compose.yml logs --tail 30 frontend api
              exit 1
            fi
            echo "Deploy successful"
